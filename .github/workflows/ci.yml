name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secretos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Contenedor oficial de gitleaks: escanea todo el historial con las reglas de .gitleaks.toml
      - run: docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:latest git /repo --redact --no-banner -v

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build:server
      - run: npm run test:server
      - name: Reglas de visibilidad contra PocketBase real
        run: |
          curl -fsSL -o /tmp/pb.zip https://github.com/pocketbase/pocketbase/releases/download/v0.40.6/pocketbase_0.40.6_linux_amd64.zip
          unzip -q /tmp/pb.zip pocketbase -d /tmp/pb
          PB_BIN=/tmp/pb/pocketbase node --test server/test/rules.test.mjs
      - run: npm run build
      - name: Caché de Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # Las dependencias del sistema vía apt fallan a veces por un espejo caído: se reintenta tras refrescar índices.
      - run: npx playwright install --with-deps chromium || (sudo apt-get update && npx playwright install --with-deps chromium)
      - run: npx playwright test
