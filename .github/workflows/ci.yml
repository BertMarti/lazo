name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secretos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Contenedor oficial de gitleaks: escanea todo el historial con las reglas de .gitleaks.toml
      - run: docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:latest git /repo --redact --no-banner -v

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build:server
      - run: npm run test:server
      - name: Reglas de visibilidad y flujo completo contra PocketBase real
        run: |
          curl -fsSL -o /tmp/pb.zip https://github.com/pocketbase/pocketbase/releases/download/v0.40.6/pocketbase_0.40.6_linux_amd64.zip
          unzip -q /tmp/pb.zip pocketbase -d /tmp/pb
          PB_BIN=/tmp/pb/pocketbase node --test server/test/rules.test.mjs server/test/flujo.test.mjs server/test/caddyfile.test.mjs
      - run: npm run build

  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Imagen oficial de Playwright: trae Chromium y sus dependencias (apt de los runners va a veces muy lento).
    container: mcr.microsoft.com/playwright:v1.65.0-noble
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright test
        env:
          HOME: /root
