name: lazo
# Guía paso a paso: docs/HOMELAB.md. Toda la configuración va en server/.env (plantilla: .env.example).

services:
  pocketbase:
    build: { context: .., dockerfile: server/Dockerfile }
    container_name: lazo-pb
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ:-Europe/Madrid}
      UNFURL_KEY: ${UNFURL_KEY:?Falta UNFURL_KEY en .env (openssl rand -hex 32)}
      UNFURL_URL: http://unfurl:8787
    # Panel /_/ solo desde la propia máquina (túnel SSH o VPN). Nunca 0.0.0.0: Caddy lo bloquea por fuera.
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./data/pb:/pb/pb_data
    networks: [interna, publica]

  unfurl:
    build: { context: .., dockerfile: server/unfurl/Dockerfile }
    container_name: lazo-unfurl
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      UNFURL_KEY: ${UNFURL_KEY:?Falta UNFURL_KEY en .env}
    # Sin puertos publicados: solo lo alcanza PocketBase por la red interna. Sale a Internet para leer páginas.
    networks: [interna, salida]

  caddy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    container_name: lazo-caddy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on: [pocketbase]
    environment:
      # Con dominio propio o DuckDNS: milazo.duckdns.org. Con Cloudflare Tunnel: http://lazo.tudominio.es
      LAZO_DOMAIN: ${LAZO_DOMAIN:?Falta LAZO_DOMAIN en .env (p. ej. milazo.duckdns.org)}
    # Con Cloudflare Tunnel pon LAZO_BIND=127.0.0.1 y no abras puertos en el router.
    ports:
      - "${LAZO_BIND:-0.0.0.0}:80:80"
      - "${LAZO_BIND:-0.0.0.0}:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
    # «tunel»: la única red desde la que Caddy acepta CF-Connecting-IP (la de cloudflared, IP fija; V-17).
    networks: [publica, tunel]

  # Copia diaria de pb_data con rotación. Sin red. Restaurar: docs/HOMELAB.md.
  backup:
    build: ./backup
    container_name: lazo-backup
    restart: unless-stopped
    network_mode: none
    environment:
      TZ: ${TZ:-Europe/Madrid}
      BACKUP_CRON: ${BACKUP_CRON:-30 3 * * *}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ./data/pb:/pb_data
      - ./data/backups:/backups

  # — Opcionales: se activan con COMPOSE_PROFILES en .env —

  # Mantiene tu subdominio de DuckDNS apuntando a la IP de casa (si HEIMDALL ya lo hace, no lo actives).
  duckdns:
    profiles: [duckdns]
    image: alpine:3.22
    container_name: lazo-duckdns
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      DUCKDNS_SUBDOMAIN: ${DUCKDNS_SUBDOMAIN:-}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:-}
    command:
      - /bin/sh
      - -c
      - 'while :; do echo "$$(date "+%F %T") DuckDNS: $$(wget -qO- "https://www.duckdns.org/update?domains=$$DUCKDNS_SUBDOMAIN&token=$$DUCKDNS_TOKEN&ip=")"; sleep 300; done'
    networks: [salida]

  # Alternativa sin abrir puertos: Cloudflare Tunnel hasta Caddy (http://caddy:80).
  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:2025.1.0
    container_name: lazo-cloudflared
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    depends_on: [caddy]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    # Red propia con IP fija: Caddy solo se fía de esta IP, y desde aquí PocketBase no es alcanzable.
    networks:
      tunel: { ipv4_address: 172.31.253.3 }

networks:
  interna:
    internal: true
  publica: {}
  salida: {}
  tunel:
    ipam:
      config:
        - subnet: 172.31.253.0/29
